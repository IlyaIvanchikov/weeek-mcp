name: release

# Publish to npm + attach the .mcpb to a GitHub Release when a v* tag is pushed.
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret, provenance is automatic.
# One-time setup on npmjs.com: package "weeek-mcp-smart" → Settings → Trusted Publisher
#   → GitHub Actions, repo IlyaIvanchikov/weeek-mcp, workflow file release.yml.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # OIDC for npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Verify tag matches package.json version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # No token: OIDC trusted publishing. Provenance is generated automatically.
      # Skipped when npm already serves this version, so a re-run of a half-finished
      # release (tag re-pushed after a fix) does not die on "cannot publish over".
      - name: Publish to npm (unless this version is already there)
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -fsS -o /dev/null "https://registry.npmjs.org/$NAME/$VERSION"; then
            echo "$NAME@$VERSION is already on npm — skipping publish"
          else
            npm publish
          fi

      # npm propagates a new version to its read API minutes after `npm publish` returns,
      # and the MCP registry refuses to list a version npm does not serve yet (it GETs
      # registry.npmjs.org/<name>/<version>). Without this wait the next step fails every
      # time with "version '<v>' was not found (status: 404)" — that is what happened on 0.4.5.
      - name: Wait for npm to serve the new version
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 40); do
            if curl -fsS -o /dev/null "https://registry.npmjs.org/$NAME/$VERSION"; then
              echo "npm serves $NAME@$VERSION after $attempt attempt(s)"
              exit 0
            fi
            echo "attempt $attempt: $NAME@$VERSION not on npm yet, waiting 15s"
            sleep 15
          done
          echo "::error::$NAME@$VERSION still not served by npm after 10 minutes — check https://status.npmjs.org and re-run this job"
          exit 1

      # Publish to the official MCP registry using the same OIDC identity — no extra secret.
      - name: Install mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Sync server.json + manifest.json versions from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json

      - name: Authenticate to the MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP registry
        run: ./mcp-publisher publish

      - name: Build the .mcpb bundle
        run: npm run pack:mcpb

      - name: Create GitHub Release with the .mcpb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" weeek-mcp-smart.mcpb --title "$GITHUB_REF_NAME" --generate-notes
